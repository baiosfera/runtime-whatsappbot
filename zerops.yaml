zerops:
  - setup: whatsappbot
    build:
      base: ubuntu/bun@1.4
      buildCommands:
        - bun install
      deployFiles:
        - .
    run:
      base: ubuntu/bun@1.4
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 3005
          httpSupport: true
      envVariables:
        PORT: "3005"
        # Optional: inject NATS_URL via Project Shared Vault / Service Env when nats:single@2.12 is provisioned
        VALKEY_URL: ${valkey_connectionString}
        DATABASE_URL: ${database_connectionString}
        BIFROST_URL: "http://bifrost:8080/v1"
        EVOLUTION_URL: "http://evolution:8085"
        EVOLUTION_INSTANCE: ${PROJECT_NAME}
        MINIO_ENDPOINT: ${objectstorage_apiHost}
        MINIO_BUCKET: ${objectstorage_bucketName}
        MINIO_ACCESS_KEY: ${objectstorage_accessKeyId}
        MINIO_SECRET_KEY: ${objectstorage_secretAccessKey}
      start: bun run src/index.ts
      healthCheck:
        httpGet:
          port: 3005
          path: /health
